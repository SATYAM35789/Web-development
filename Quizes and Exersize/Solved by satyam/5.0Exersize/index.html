<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Exersize 5</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        nav{
            background-color: blue;
        }
        ul li{
            list-style: none;
            display: inline;
            padding: 34px;

        }
        .boxes{
            border: 2px solid black;
            background-color: orange;
            width: auto;
            height: 70vh;
        }
        .box{
            margin:  34px 10px 50px 80px;
            padding: 2px ;
            width: 310px;
            height: 50vh;
            border: 2px solid red;
            background-color: lightgoldenrodyellow;
            
        }
        .welcomebox{
            border: 2px solid black;
            margin: 8px 45px;
            width: 80vw;
            height: 90px;
            border-radius: 20px;
            background-color: plum;
        }
        div>p{
            font: bold;
            text-align: center;
            margin: 33px;
            
        }
        .fixed{
            border: 2px solid black;
            background-color: lightgreen;
            height: 80px;
            width: 65px;
            border-radius: 80%;
            float: right;
            position: fixed;
        }
        .footer{
            border: 2px solid black;
            background-color: rgb(203, 213, 203);
            margin: 3px;
            padding: 3px;
            height: 15px;
            width: auto;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>                
                <li> Services</li>
                <li>Contact us</li>
            </ul>
        </nav>
    </header>
    <div class="boxes">
        <div class="box"></div>
    </div>
    <div class="welcomebox"> 
        <p> Welcome to the Sigma Web Development Express</p>
    </div>
    <div class="fixed">

    </div>
    <footer>
        <div class="footer"></div>
    </footer>
    
</body>
</html>
