<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exersize 3rd</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body {
            background-color: gray;
            padding: 45px;
        }

        .card {
            background-color: white;
            width: 198px;
            height: 444px;
            border-radius: 7px;

        }

        .image {
            padding: 5px;
        }

        .image img {
            border-radius: 7px;
        }
        .content{
            padding: 5px 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .content p{
            font-size: 13px;
            color: gray;
        }
        .capsules{
            padding: 0 24px 0 14px; /* padding: top left bottom right*/
        }
        .capsules span{
            border: 2px solid black ;
            margin: 2px;
            padding: 0px 6px ;
            font-size: 12px;
            border-radius: 7px;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .button{
            text-align: center;
        }
        .button button{
            padding: 4px 7px;
            margin-top: 4px;
            border-radius: 15px;
            background-color:lightblue;
            color: blue;
            font-size: 10px;
            border: none;
        }
        
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img src="img.png" alt="Sahil Photo" width="188px" height="184">
        </div>
        <div class="capsules">
            <span> Nature </span> 
            <span> Lake </span>
        </div>
        <div class="content">
            <h2> Satyam Mishra</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Totam commodi omnis, necessitatibus id error ad.
                Maiores amet, dicta repellat error labore suscipit omnis!</p>
        </div>
        <div class="button">
            <button> Read More</button> </div>
    </div>
</body>

</html>
