<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Dom Part 2</title>
</head>
<body>
    <ul>
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
    </ul>
    <script>
        // Append Child : adding Child
      let title =  document.createElement("h1");
      title.className = "pwskills";
      title.style.fontSize = "25px";
      title.textContent = "pw Skills, Namaste"
      console.log(title);
      
      // Showing the details on the web page or js ko batana ki jo likf hai usko web page par show karo
      document.body.appendChild(title);


      // Remove Child
      let ul = document.querySelector("ul");
      console.log(ul);
      let lists = document.querySelectorAll("li"); // Selecting all tag of ul
      console.log(lists);
      for(list of lists) {
        ul.removeChild(list);
      }
      
    </script>
</body>
</html>
