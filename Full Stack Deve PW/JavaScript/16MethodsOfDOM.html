<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 1</title>
</head>

<body>
    <!-- Id -->
    <p id="one"> Namaste  <span> Hello </span></p>

    <!-- Class -->
     <ul>
        <li class="tech">One</li>
        <li class="tech">Two </li>
        <li class="tech"> Three </li>
     </ul>

     <!--  Tagname -->
       <h4>Hey</h4>
       <h4> Namaste</h4>
       <h4> Hola</h4>

       <!-- Query Selector : id(#),class(.), tagname use kar sakte hai sath mai-->
        <h2>Hello</h2>
        <h2 class="classs"> Hola </h2>
        <h2 id="ids"> hey </h2>
    <script>
        // Id 
        let var1 = document.getElementById("one");
        console.log(var1.innerText);
        // Class
        let var2 = document.getElementsByClassName("tech");
        console.log(var2[2]);
        var2[1].innerText = " Nodejs"
        
        // Tag (Manupulate + CSS)
        let var3 = document.getElementsByTagName("h4")
        console.log(var3[1].innerHTML);
        var3[2].innerText = " Satyam Mishra I4U"
        var3[2].style.color = "red"

        // Query Selector 
        let var4 =document.querySelector(".classs")
        console.log(var4);

        // var4.className = "hello"  // Changes Original Class name
        var4.classList = " hello helo hola "  // Giving multiple classname to tag  
        var4.setAttribute("id","js")
        
    </script>
</body>

</html>
