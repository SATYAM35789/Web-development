<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= initial-scale=1.0">
    <title>Class | html</title>
</head>
<body>
    <!-- Using Reserved key of HTML -->
    <!-- Displaying  5 > 3 -->
    <p> 5 &gt; 3 </p>
    <p> 5 &copy; 3 </p>
    <p> 5 &quot; 3 </p>
    <p> 5 &amp; 3 </p>
    <p> 5 &reg; 3 </p>
    <!-- Adding extra  space  -->
    <p> 5 Lorem  &nbsp ipsum &nbsp&nbsp&nbsp&nbsp&nbsp dolor sit amet consectetur adipisicing elit. Odit, architecto? 3 </p>
    <!-- Using Reserved key in simpler form -->
    <p> &#60;     &#61;   &#65;  &#97;</p>
</body>
</html>
