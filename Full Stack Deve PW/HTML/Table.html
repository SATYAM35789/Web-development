<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Table</title>
</head>
<body>
    <!-- Table  -->
     <!-- cellpadding: cell mai space or jagah dena ander se, margin : jagah dena bahar se-->
     <table border cellpadding ="16ppx" cellspacing="5px"  >
        <tr>
            <th>Sr.</th>
            <th>Sub1</th>
            <th>Sub2</th>
            <th>Sub3</th>
        </tr>
        <tr>
            <td>1</td>
            <td>English</td>
            <td colspan="2">Hindi</td>
            
        </tr>
        <tr>
            <td>2</td>
            <td rowspan="2" >English</td>
            <td >Hindi</td>
            <td> Maths</td>
        </tr><tr>
            <td>3</td>
            <!-- <td >English</td> -->
            <td>Hindi</td>
            <td> Maths</td>
        </tr>
     </table>
</body>
</html>
