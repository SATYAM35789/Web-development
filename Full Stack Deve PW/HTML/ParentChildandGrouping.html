<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Class 4 | HTML </title>
</head>
<body>
    <!-- div>p>li Used it for fast coding -->
    <div>
        <p>
            <li></li>
        </p>
    </div>
    <!-- Printing any tab multiple time : div*5 -->
     <div> </div>
     <div></div>
     <div></div>
     <div></div>
     <div></div>
     <!-- Parent-child  -->
     <!-- div>p>li -->
     <div>
        <p>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </p>
     </div>
     <!-- div.class1>p.classp>p#un1>li*5 -->
     <div class="class1">
        <p class="classp">
            <p id="un1">
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </p>
        </p>
     </div>
     <!-- Sibling or Brotherhood -->
      <!-- Addition  div>p+p+p -->
      <div>
        <p></p>
        <p></p>
        <p></p>
      </div>
      <!-- Multiplication -->
       <!-- div>li*10 -->
       <div>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
       </div>
       <!-- Grouping :  -->
        <!-- div>(nav>li*5)+section -->
        <div>
            <nav>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </nav>
            <section></section>
        </div>
</body>
</html>
