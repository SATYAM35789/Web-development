<!-- Position: hame help karta hai kisi element ko kisi bhi postion par rakhne ke liye top-down and keft-right se -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Position </title>
    <style>
        .box {
            height: 100px;
            width: 100px;
        }
        .box1 {
            background-color: red;
        }
        .box2{
            background-color: yellow;
            position: fixed;
            bottom: 0;
            right: 10px;
            border-radius: 50%;
        }
        .box3{
            background-color: blue;
        }
    </style>
 </head>
 <body>
    <!--  Postion -->
      <d class="main">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
      </d>       
 </body>
 </html>
