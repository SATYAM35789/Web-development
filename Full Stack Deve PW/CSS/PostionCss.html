<!-- Position: hame help karta hai kisi element ko kisi bhi postion par rakhne ke liye top-down and keft-right se -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Position </title>
    <style>
        .box {
            height: 100px;
            width: 100px;
            border: 3px solid black;
        }
        .box1 {
            background-color: red;
        }
        /* Position Absolute : Apne position ke according change hota hai 
        Relative: Ye apni original postion ke according apni postion change karta hai*/
        .box2{
            background-color: yellow;
            position: absolute;
            top: 40px;
            left: 30px;
        }
       
        .box3{
            background-color: blue;
          
        }
    </style>
 </head>
 <body>
    <!--  Postion Sticky-->
      <d class="main">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
      </d>       
 </body>
 </html>
