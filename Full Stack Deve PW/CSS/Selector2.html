<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors 2</title>
    <link rel="stylesheet" href="Style5.css">
</head>
<body>
    <!-- Descendant Selectors -->
     <h1> Hello World</h1>
     <main>
        <p>
            Hello I am paragraph.
        </p>
     </main>
     <!-- Child Selector -->
     <h1>
        <p> Hola World</p>
     </h1>
     <!-- Sibling selecor -->
     <section>
        <p> Hello Para </p>
     </section>
     <p> I am the 1st Paragraph</p>
     <!-- General sibling selector -->
     <div>
        <p> hey! Sweety</p>
     </div>
     <p> It's time to be consistant </p>
     <h1> Hello</h1>
     <p> Hey what's app</p>
     <!-- Attribute selector -->
      <a href="google.com" target="_blank"> Google </a>
       <img src="hello.jpg" alt="say">
    <img src="hello.jpg" alt="say">
</body>
</html>
