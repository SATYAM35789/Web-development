<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intermediate </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/b6b7079cb7.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="h-screen flex">
        <img class="hidden lg:block w-1/2  "
            src="https://media.istockphoto.com/id/1326617698/photo/healthy-balanced-vegetarian-diet-vegetables-fruits-cereals-containing-protein-top-view.jpg?s=612x612&w=0&k=20&c=cBl1EuVKOIh9judpEb4z3UBJxXTS5XZorMGeB3WQYJg="
            alt="healthy-balanced-vegetarian-diet-vegetables-fruits-cereals">
        <!-- Login Section  -->
        <div class="flex flex-col justify-center items-center border w-fullm lg:w-1/2">
            <div class="text-xl font-bold text-center lg:text-left">
                <span class="text-green-600"> </span>
                <span>FarmMan</span>
            </div>

            <div class="mt-10 font-bold text-3xl lg:text-left">
                <h2>Hello,</h2>
                <h2>Welecome Back</h2>

            </div>

            <!-- Login Form -->
            <form action="" class="mt-10 w-[80%] lg:w-96 mx-auto space-y-4 ">
                <h2>Login to manage your account,</h2>
                <input type="email" class="border w-full px-4 py-2" placeholder="Email">
                <input type="password" class="border w-full px-4 py-2" placeholder="Password">
                <div class="text-blue-600 hover:text-blue-400">
                    Forgot your password ?
                </div>
                <button class="w-full mt-2 bg-green-600 py-2 rounded text-white hover:bg-green-400 "> Login </button>
                <div class="text-center space-y-4 mt-4">
                    <span> or </span>

                    <div class="flex gap-10 justify-center items-center">
                        <span><i class="fa-brands fa-facebook"></i></span>
                        <span> <i class="fa-brands fa-google"></i></span>
                        <span> <i class="fa-brands fa-square-instagram"></i></span>
                    </div>

                    <div class="mt-4 text-sm text-center">
                        don't have a account ?
                        <span class="text-blue-600 hover:text-blue-400">Sign Up here</span>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
