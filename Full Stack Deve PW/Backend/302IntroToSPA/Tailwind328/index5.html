<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Project Advanced </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/b6b7079cb7.js" crossorigin="anonymous"></script>
</head>

<body>
    <header class="h-auto md:h-full bg-cover bg-amber-100
     text-[#043A53]">
        <nav class="bg-cover bg-green-900 fixed top-0 z-20 w-screen px-4 lg:gap-x-14
         md:bg-transparent h-16 flex items-center justify-center">
            <div class="flex items-center justify-between w-full">
                <img src="" class="w-24 h-5" alt="logo">
                <ul class="hidden md:flex font-semibold">
                    <li class="md:mx-2 lg:mx-2 cursor-pointer">Features</li>
                    <li class="md:mx-2 lg:mx-2 cursor-pointer">Solutions</li>
                    <li class="md:mx-2 lg:mx-2 cursor-pointer">Company</li>
                    <li class="md:mx-2 lg:mx-2 cursor-pointer">Resources</li>
                    <li class="md:mx-2 lg:mx-2 cursor-pointer">Contact</li>
                </ul>

                <div class="md:hidden text-3xl text-[#043A53]">
                    <i class="fa-solid fa-bars"></i>
                </div>

                <div class="hidden md:flex">
                    <div class="md:px-2 lg:px-4 py-1 bg-white text-[#12141D] rounded-2xl mr-2"> Log in</div>
                    <div class="md:px-2 lg:px-4 py-1 bg-white text-[#12141D] rounded-2xl mr-2"> Sign in</div>
                </div>
            </div>
        </nav>

        <div class="flex flex-wrap h-full w-full">
            <div></div>
            <div></div>
        </div>
    </header>
</body>

</html>
