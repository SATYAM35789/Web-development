<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Boxmodal</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            background-color: aqua;
        }
        .box1{
              color: yellow;
              padding: 10px;
              margin: 25px;
              border: 2px solid blue;
              height: 200px;
              box-sizing: border-box;

        }
        /* Margin collapse concept: agar do margin collapse ho rahi hai jo bada hoga wahi margin lagegi*/
        .box2{
            color: red;
            padding: 10px;
            margin: 25px;
            border: 2px solid rgb(255, 0, 0);
            height: 200px;
            box-sizing: border-box;
        
        }
   
    </style>
</head>
<body>
    <div class="box box1"> I am a Box</div>
    <div class="box box2"> I am another Box</div>
</body>
</html>
