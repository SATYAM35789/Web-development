<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container{
            background-color: rgb(9, 106, 106);
            height: 80vh;
            width: 30vw;

        }
        .box{
            width: 34px;
            height: 45px;
            /* background-color: aqua; */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            /* animation: satyamAnimation;
            animation-duration: 2s; */
            /* animation-iteration-count: infinite; */
            /* animation-iteration-count: 11;
            animation-timing-function: ease-in-out; */
            /* Delay means kitne minute baad start ho */
            /* animation-delay: 3s; */
            /* animation-direction: alternate-reverse; */
            /* animation-play-state: paused; */
            animation: satyamAnimation 2s ease-in-out 1 forwards , satyam2 3s ease-in-out 4 ; /*backword*/
        }
        @keyframes satyamAnimation {
            from{
               background-color: red;
            }
            to{
                background-color: yellow;
                transform: translateX(1000px);

            }
        }
        @keyframes satyam2{
            0%{
                transform: rotate(100deg);
            }
            20%{
                transform: rotate(200deg);
            }
            50%{
                transform: rotate(220deg);
            }
            80%{
                transform: rotate(300deg);
            }
            100%{
                transform: rotate(310deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box</div>
    </div>
</body>
</html>
