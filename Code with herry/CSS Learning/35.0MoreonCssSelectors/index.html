        /* Pseudo element */
        .boxes::before{

        }
        .boxes::after{
            content: " Leaning the Web Devlopment ";
            color: red;
        }
        ::selection{
            color: aqua;
            background-color: black;
        }
        .box::first-letter{

        }
        input::placeholder{
            color: rgb(74, 74, 237);

<body>
