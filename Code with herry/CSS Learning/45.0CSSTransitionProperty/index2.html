<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Transition</title>
    <style>
        .container{
            background-color: antiquewhite;
            width: 50vw;
            height: 40vh;
        }
        .box{
            background-color: rgba(9, 152, 104, 0.789);
            width: 5vw;
            height: 4vh;
            
            /* transition-property: transform ;
            transition-duration: 3s;
            transition-timing-function: ease-in-out ;
            transition-delay: 1s; */
            transition: all 3s cubic-bezier(0, 0.77, 0.33, 1.07) 1s; 
        }
        .translate{ 
            transform: translateX(10vw) translateY(10vh);
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box translate"></div>
    </div>
</body>
</html>
<!-- Transition:- Moving from one state to another state.  -->
