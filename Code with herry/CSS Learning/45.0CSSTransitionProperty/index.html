<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Transition</title>
    <style>
        .container{
            background-color: antiquewhite;
            width: 50vw;
            height: 40vh;
        }
        .box{
            background-color: rgba(9, 152, 104, 0.789);
            width: 5vw;
            height: 4vh;
            /* Inspect this by transform in transition */
            /* transition-property: transform ; all ka use kar sakte hai transform , sare property par lag jayegi */
            transition-property: background-color transform ;
            transition-duration: 3s;
            transition-timing-function: ease-in-out ;
            transition-delay: 1s;
        }
        .translate{
            transform: translateX(10vw) translateY(10vh);
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box translate"></div>
    </div>
</body>
</html>
<!-- Transition:- Moving from one state to another state.  -->
