    <title>CSS Specificity</title>
    <style>
        h1{
            /* Specificity priority:- Inline style > ID Selectoe > Class or Attribute
            selector > Element selector > Universal Selector*/
            /* The specificity of thgis selector is 1*/
            color: aqua;
        }
        .yellow{
            /* The specificity of thgis selector is 10*/
            color: yellow;
        }
        .cred{
            /* The specificity of thgis selector is 10*/
            color: red;
        }
        .cpurple{
            /* The specificity of thgis selector is 10*/
            color: purple;
        }
        /*Attribute Selector
        [data-x=a]{
            background-color: red;
        } */
        /* :- User Agent stylesheet :- Sheets which from the brawoser

    </style>
</head>
