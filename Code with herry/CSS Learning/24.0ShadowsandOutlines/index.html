<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Shadows and Outlines</title>
    <style>

        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 5px 5px #81f406;
        }
        .text-element{
            text-shadow: 4px 2px 3px #e71414;
            outline: 2px solid blue;
            border: 2px solid green;
            outline-offset: 10px;
        }
    </style>
</head>
<body>
  <div class="box"> I am box</div>
  <p class="text-element"> Lorem ipsum dolor sit amet consectetur adipisicing elit. Minus modi aut incidunt et delectus? Officia dolores laudantium necessitatibus sed repellendus suscipit. Hic molestias iusto voluptatibus deserunt nobis enim nemo aperiam. Nihil est tempora temporibus?</p>
</body>
</html>
