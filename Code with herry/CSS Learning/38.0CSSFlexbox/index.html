<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        .container{
            border: 2px solid red;
            /* We want to assign the all the item , allign left to right */
            display: flex;
            height: 80vh;
            /* Horizontal center*/
            /* Properties:- space-around , space-between, space-evenly, flex-end , flex-start , baseline*/ 
            /* justify-content: flex-start; */
            justify-content: center;
            /* Vertically Center*/
            align-items: center;
        }
.item{
    height: 62px;
    width: 62px;
    border: 2px solid black;
    margin: 4px;
    background-color: violet;
}
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </main>
</body>
</html>
