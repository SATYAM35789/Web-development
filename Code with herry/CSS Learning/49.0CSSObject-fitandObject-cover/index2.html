<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Position without image tag</title>
    <style>
        .container{
            width: 566px;
            height: 655px;
            border: 2px solid black;
            background-color: azure;
            background-position: center;
            background-image: url(img.jpg.jpg);
            /* By default in background-img the image are repeat */
            background-repeat: repeat-x;
            
        }
        
    </style>
</head>
<body>
    <div class="container">

    </div>
</body>
