<!-- Class and ID
 What are classes:- The class attributes lets you give the same name to multiple HTML elements .
 That way, you can easily change their look or behavior all at once. Classes are not unique and can 
 assigned to multiple to elments. They are generally used for applying the same stles or behaiors
 to group of elements.-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID and Classes in HTML</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <div  id="firstdiv" class="red" > First</div> <!-- Ek element ka ek he id ho sakti hai lakin uske multiple classes ho sakte hai and vise versa-->
    <div id="seconddiv" class="red bg-yellow" > Second </div> <!-- Multiple class space laga kar dete hai-->
    <span class="red"> span </span> <!-- Id also help in linking the webpages-->
 </body>
 </html>
