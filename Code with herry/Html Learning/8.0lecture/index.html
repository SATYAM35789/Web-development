<!--Inline and Block element
Inline width do not start on a new line and only take up as much width is necessary.
What are block level element
Block-level elements are those that start on a new line and take up the entire width of their
container by default. They essentially claim all the horizontal space for themselves,
pushing and content that comes after them to a new line.
We can set the display property of element.
How we can know that which element is inline or block.
 -Sir had made the comprehensive list  -->
